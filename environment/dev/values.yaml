####################################### Library FE #######################################
library-fe:
  image:
    tag: latest
    pullPolicy: Always

  # U dev okruzenju FE je javno dostupan preko NLB-a
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

####################################### Library BE #######################################
library-be:
  image:
    tag: latest
    pullPolicy: Always

  config:
    DB_HOST: "library.cv2iyum6yswq.eu-central-1.rds.amazonaws.com"
    DB_PORT: "5432"
    DB_NAME: "librarydb"

  sealedSecret:
    enabled: true
    encryptedData:
      DB_USERNAME: 
      DB_PASSWORD: 
